<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Island Keeper Adventure - 3D Game</title>
    <link rel="stylesheet" href="./src/styles/game.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #6da2c9;
        user-select: none;
      }
      #webgl {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1b2838 0%, #0a111a 100%);
        color: #ffffff;
        font-family: system-ui, sans-serif;
        font-size: 1.1rem;
        z-index: 100;
        transition: opacity 0.5s ease;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading">
      <div class="spinner"></div>
      <div id="loading-text">Preparing Island Adventure...</div>
    </div>

    <!-- 3D Canvas -->
    <canvas id="webgl"></canvas>

    <!-- Bottom Controls Hint -->
    <div class="hud-controls">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</span>
      <span><kbd>Shift</kbd> Sprint</span>
      <span><kbd>Space</kbd> Jump</span>
      <span><kbd>E</kbd> Interact</span>
      <span><kbd>F</kbd> Kick / Push</span>
      <span><kbd>Mouse Drag</kbd> Look</span>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
