  <!-- TASK 2: SKELETAL ANIMATION & ANIMATIONMIXER STUDIO                    -->
  <!-- ===================================================================== -->
  <div class="hud-overlay">
    <div class="hud-title">🏃 Skeletal Animation Studio</div>
    <div class="hud-list">
      <div class="hud-item"><span>Orbit Controls</span><span class="hud-key">Mouse Drag</span></div>
      <div class="hud-item"><span>Zoom</span><span class="hud-key">Wheel</span></div>
      <div class="hud-item"><span>Pan Scene</span><span class="hud-key">Right Click</span></div>
      <div class="hud-item"><span>Toggle Bones</span><span class="hud-key">B</span></div>
      <div class="hud-item"><span>Play / Pause</span><span class="hud-key">Space</span></div>
    </div>
  </div>

  <div class="mixer-dashboard">
    <div class="mixer-header">
      <div class="mixer-title">
        <span>⚡ THREE.AnimationMixer</span>
        <span class="mixer-badge" id="badge-clip-name">Clip: mixamo_com</span>
      </div>
      <span class="mixer-badge" id="badge-playback-state">STATE: PLAYING</span>
    </div>

    <div class="mixer-controls-row">
      <button class="mixer-btn active" id="btn-play">▶ Play</button>
      <button class="mixer-btn" id="btn-pause">⏸ Pause</button>
      <button class="mixer-btn" id="btn-stop">⏹ Stop (Reset)</button>
      <button class="mixer-btn" id="btn-toggle-skeleton">🦴 Skeleton Rig</button>
      <button class="mixer-btn" id="btn-loop-mode">🔁 Loop: Repeat</button>
      <button class="mixer-btn" id="btn-reset-cam">🎥 Reset Cam</button>
    </div>

    <div class="mixer-slider-group">
      <span class="mixer-slider-label">Timeline</span>
      <input type="range" class="mixer-slider" id="timeline-scrubber" min="0" max="1" step="0.001" value="0" />
      <span class="mixer-val" id="time-display">0.00s / 0.00s</span>
    </div>

    <div class="mixer-slider-group">
      <span class="mixer-slider-label">Speed</span>
      <input type="range" class="mixer-slider" id="speed-slider" min="0.1" max="2.5" step="0.05" value="1.0" />
      <span class="mixer-val" id="speed-display">1.00x</span>
    </div>
  </div>

  <script type="module" src="./task2.js"></script>
</body>
</html>
